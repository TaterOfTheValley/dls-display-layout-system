name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/DLS.csproj -c Release --nologo

      # Release day is a bad time to discover that publishing is broken, so CI
      # exercises the same single-file publish the release workflow runs. The
      # output is thrown away; only the exit code matters.
      - name: Smoke-test the release publish
        run: >
          dotnet publish src/DLS.csproj -c Release -r win-x64 --nologo
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o ci-publish

      - name: Smoke-test the installer package
        shell: bash
        run: |
          set -euo pipefail
          cp THIRD-PARTY-NOTICES.md ci-publish/
          dotnet tool install --tool-path ci-tools vpk --version 1.2.0
          ci-tools/vpk.exe pack \
            --packId DLS-DisplayLayoutSystem \
            --packTitle "DLS - Display Layout System" \
            --packVersion 0.1.0-alpha \
            --packDir ci-publish \
            --mainExe DLS.exe \
            --runtime win-x64 \
            --noPortable true \
            --releaseNotes RELEASE_NOTES.md \
            --outputDir ci-pack
